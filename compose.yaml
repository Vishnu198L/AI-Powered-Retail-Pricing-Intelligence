
services:
  backend:
    build:
      context: .
      dockerfile: backend/DockerFile
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/DockerFile
    ports:
      - "8501:8501"
    environment:
      API_URL: "http://backend:8000"
    depends_on:
      - backend
